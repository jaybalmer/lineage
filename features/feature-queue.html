<title>Linestry Feature Queue</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; color: #1c1a17; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 18px 48px; }
  header h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { font-size: 12.5px; color: #78716c; margin: 0 0 14px; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .count { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #f5f5f4; color: #44403c; border: 1px solid #e7e5e4; }
  .count b { font-weight: 800; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 16px; }
  .chip { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid #d6d3d1; background: #fff; color: #44403c; cursor: pointer; }
  .chip.active { background: #1c1a17; color: #fff; border-color: #1c1a17; }
  #q { flex: 1; min-width: 160px; font-size: 13px; padding: 8px 11px; border: 1px solid #d6d3d1; border-radius: 9px; }
  .group { margin: 18px 0 6px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #78716c; }
  .card { border: 1px solid #e7e5e4; border-radius: 11px; padding: 12px 14px; margin: 8px 0; background: #fff; }
  .card.lead { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b inset; }
  .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 800; font-size: 13.5px; color: #292524; }
  .what { font-size: 12.5px; color: #57534e; margin: 6px 0 0; line-height: 1.45; }
  .size { font-size: 12px; color: #115e59; margin: 6px 0 0; line-height: 1.4; }
  .note { font-size: 12.5px; color: #57534e; margin: 5px 0 0; line-height: 1.45; }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }
  .b { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em; }
  .ready { background: #ccfbf1; color: #115e59; }
  .dec { background: #f3e8ff; color: #6b21a8; }
  .park { background: #f5f5f4; color: #57534e; }
  .lead-b { background: #f59e0b; color: #fff; }
  .brief { font-size: 11.5px; color: #2563eb; margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .empty { color: #a8a29e; font-size: 13px; padding: 20px 0; text-align: center; }
  details.shipped { margin-top: 26px; border-top: 1px solid #e7e5e4; padding-top: 12px; }
  details.shipped summary { font-size: 12.5px; font-weight: 700; color: #78716c; cursor: pointer; }
  .ship { font-size: 12.5px; color: #57534e; margin: 7px 0; line-height: 1.45; }
  .ship b { color: #292524; }
  footer { margin-top: 22px; font-size: 11.5px; color: #a8a29e; line-height: 1.5; }
</style>
</head>

<script>
  const SNAPSHOT = "September 8, 2026";
  const LEAD = "Presenting partner surfacing (featured group + landing card)";
  const FEATURES = [{"name": "The episode 1 run (sequenced against a one-to-two-week date)", "group": "ready", "lead": false, "brief": "", "size": "", "what": "", "note": ""}, {"name": "DO FIRST (ops, ~30 to 45 min): Ops tree hygiene", "group": "ready", "lead": false, "brief": "features/ops-tree-hygiene-brief.md", "size": "~30 to 45 min, ONE PR, NO migration, no src/ file touched. SAFE, self-merge.", "what": "the wrapper stops counting dirt under bugs/ and features/ and instead commits it as chore(ops) at preflight, the auto PR is narrowed so ops prose can never ride into a fix, and PR #214 is finished by hand so all 60 trackers are actually in git.", "note": ""}, {"name": "Presenting partner surfacing (featured group + landing card)", "group": "ready", "lead": true, "brief": "features/presenting-partner-surfacing-brief.md", "size": "~2 to 3 hr, ONE PR, NO migration, no new columns, no admin work. SAFE, so the session self-merges.", "what": "a \"Presenting Partner\" group pinned above every bucket and every sort on /[community]/brands, plus a single presenting-partner card on the landing page between the snowboarding focus card and the equity teaser. Both read curation_tier, partner_label, logo_url and description off the org row, all four of which /admin/brand/[id] already edits, so the next brand partner is a dropdown rather than a session.", "note": ""}, {"name": "2. Funnel drop-off repairs, PR 2", "group": "ready", "lead": false, "brief": "features/funnel-drop-off-repairs-brief.md", "size": "the remainder of the original 5.5 to 6.5 hr estimate, NO migration.", "what": "R3, R5 and R8 (R4 and most of R7 were absorbed by the signup handoff in PR #234 and must not be built twice; R1, R2 and R6 shipped in PR 1).", "note": ""}, {"name": "After episode 1", "group": "ready", "lead": false, "brief": "", "size": "", "what": "", "note": ""}, {"name": "PB-010 Phase 5: Announced / Future Events", "group": "ready", "lead": false, "brief": "features/pb010-phase5-announced-events-brief.md", "size": "~3 to 4 hr. First PB-010 migration since Phase 1.", "what": "forward-facing public timeline. Announced events render distinctly (outlined, countdown chip), auto-roll to historical at date, visitor \"mark interest\" via the Phase 4 tag loop. Post-MVP. (Was lead until July 20, again briefly on Aug 19, and again Sep 4 morning.) Brief drafted June 16, so re-verify against main before building.", "note": ""}, {"name": "PB-010 Phase 6, Distribution (4 independent sub-phases)", "group": "ready", "lead": false, "brief": "features/pb010-phase6-distribution-brief.md", "size": "each sub-phase its own session + PR. 6a Embed + oEmbed (~3 hr, recommend first), 6b Custom subdomain (~2 hr + OPS-GATED on Vercel wildcard DNS), 6c Theming (~3 to 4 hr, one migration), 6d Owner analytics (~3 to 5 hr, PostHog). None blocks another; none depends on Phase 5.", "what": "", "note": ""}, {"name": "Feature FNRad on Linestry, in three places.", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "PARTS (a) AND (c) DRAFTED September 8, 2026 and staged as the Queue LEAD: features/presenting-partner-surfacing-brief.md. Jay's calls at drafting: build the featured group and the landing card, make the mechanism generic on orgs.curation_tier = 'founding' rather than FNRad-specific, and include the partner-label pill. Part (b), the curated featured page, remains here and is NOT drafted; its shape is decided (a hand-edited constants file in src/lib/, same pattern as src/lib/fnrad.ts, no table and no admin screen) but its nav entry is an open chassis question, since the lens row is a deliberately fixed three slots (lens-row.tsx:15) and a \"Featured\" destination is more likely a category-row entry or a link from the landing card than a fourth lens. Draft it after episode 1 with click data from (a) and (c) in hand. Original bullet follows. _(from the in-app feedback widget, September 7, 2026, [Linestry Idea] lane):_ \"I want to feature FNRad on Linestry. - top of Brand list, a featured group at the top that could be home to future brand partners - maybe a featured page linked off top menu bar, this page would include FNRad and a curate list of pages to check out, with editable descriptions (i,e Jay Balmer - founder page, FNRad partner, Boards - the big list) - Card on the main landing page about being a presenting sponsor\". Sent by OWNER (signed-in member) from /snowboarding/brands on desktop Chrome at 1770x766; replay S-58; no screenshot claimed, none in Drive. NEEDS A DRAFTING PASS, and it is really three asks that could ship independently. What it would touch if built: (a) the brands index src/app/(community)/[community]/brands/page.tsx, which today has no featured concept at all, though orgs.curation_tier ('standard' | 'curated' | 'founding', src/types/index.ts:349, shipped with Brand Page Redesign Phase 2) is exactly the column a featured group would sort on, so (a) is mostly a read-side grouping change with no migration; (b) a new curated \"featured\" route plus a nav entry in the row-2 chassis, which is the heaviest of the three and is the only one needing new storage for the editable descriptions; (c) a card on src/app/page.tsx, which is copy and layout only. Timing note: this is the first idea to arrive that is directly commercial (presenting-sponsor placement for the season-12 deal) and episode 1 is one to two weeks out, so (a) and (c) are the cheap pair worth sizing against that date."}, {"name": "Give the other index pages the treatment the boards page has, including totals", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(from the in-app feedback widget, September 8, 2026, [Linestry Idea] lane): \"The Board page is good, showing the numbers clearly at the top and highlighting the recently added. A good start to a catalog/index. The other pages need something similar, including the total numbers\". Sent by OWNER (signed-in member) from /snowboarding/boards on desktop Chrome at 1351x856; replay S-57; no screenshot claimed, none in Drive. NEEDS A DRAFTING PASS. What it would touch if built: the four sibling index pages (Places, Events, Riders, Brands), lifting two patterns that today exist only on src/app/(community)/[community]/boards/page.tsx, the count header and the recentlyAdded rail (:246-249, newest eight by created_at). Both are client-side derivations off the already-resident catalog, so this is very likely no migration and no new endpoint. Adjacent to the shipped Category page calls to action (PR #190), which gave those same four pages their intro-card and CTA treatment; this is the natural second pass on the same set. Also adjacent to the August 20 catalog bullet below, but distinct: that one deepens the boards page, this one propagates it outward."}, {"name": "Rank the boards \"Recently added\" rail by recent photos, not recent rows", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(from the in-app feedback widget, September 8, 2026; LANE CORRECTION, it arrived in the [Linestry Bug] lane and is a proposal, not a defect): \"On the Snowboard Catalog page, the Recently Added list would be better if it just showed boards that had pictures added recently\". Sent by OWNER (signed-in member) from /snowboarding/boards on desktop Chrome at 1566x895; replay S-57, the same session as the bullet above; no screenshot claimed, none in Drive. NEEDS A DRAFTING PASS, and it carries one real question. What it would touch if built: recentlyAdded in src/app/(community)/[community]/boards/page.tsx:246-249, which today sorts all scoped boards by created_at and takes eight. The ask is to rank by image recency instead, and there is no column for that: the page already knows which boards have art (image_url or the communityBoardImages set, used at :240) but not when the art landed. So the cheap version is \"recently added AND has an image\", which is a one-line filter and needs nothing new; the literal version (\"pictures added recently\") needs a timestamp the schema does not carry. Worth noting the September 4 catalog merge took the site to 3,180 boards, most of them art-less, which is presumably what prompted this."}, {"name": "Make the \"Send feedback\" entry visually obvious in the menu", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(from the in-app feedback widget, September 7, 2026; LANE CORRECTION, it arrived in the [Linestry Bug] lane and is a proposal, not a defect): \"highlight the Send Feedback button, like blue pill for feedback on the drop down menu. So it is easy for new users to spot, without having to look for it\". Sent by OWNER (signed-in member) from /snowboarding/brands on desktop Chrome at 1770x766; replay S-58, the same session as the FNRad bullet; no screenshot claimed, none in Drive. NEEDS A DRAFTING PASS, but it is the smallest item on this list. What it would touch if built: two files and nothing else, src/components/ui/nav/avatar-dropdown.tsx:208-215 (signed-in) and src/components/ui/nav/guest-menu.tsx:88-95 (logged out), both of which render \"Send feedback\" as a plain menu row today. Pure styling, no logic, no data. Worth sizing against the FNRad date for a different reason than it was asked: the feedback widget is the intake for this whole triage loop, so making it findable directly raises the volume of signal from a wave of new listeners."}, {"name": "Drop a returning signed-in member on the Feed, not the landing page", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(from the in-app feedback widget, September 2, 2026; LANE CORRECTION, it arrived in the [Linestry Bug] lane and is a proposal, not a defect): \"When user is signed in and returning to the site, they expect to be dropped on the Feed page to see the activity.\" Sent from https://linestry.com/ on desktop Chrome at 1560x906, recorded by the widget as Anonymous (logged out), which is worth reading literally: the sender was signed out at the moment of writing, so this is an observation about the pattern rather than a live complaint. No screenshot, none claimed. Replay S-51. NEEDS A DRAFTING PASS. What it would touch if built: src/app/page.tsx, which is already auth-aware (it swaps the hero CTA to \"My Timeline\" when signed in) but never redirects, so the change is either a redirect in src/proxy.ts on / for a session-bearing request, or an auth-aware client redirect on the landing page itself. The real question is a product one and is Jay's: is / a marketing surface that a returning member should still see (it is the page the Instagram hero screenshot is cut from, and PR #213 was just spent tightening its copy), or is it dead weight for someone who already has an account? A middle option exists: keep the page and make the signed-in hero CTA land on /snowboarding/feed rather than the timeline. Note the redirect version interacts with the FTUE entry path and with proxy.ts gating, which is where BUG-166 and BUG-168 both lived, so it is auth-adjacent and not a casual change."}, {"name": "Sticky \"whose timeline am I on\" header, with auto-hiding nav rows while scrolling", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(from the in-app feedback widget, September 2, 2026; LANE CORRECTION, it arrived in the [Linestry Bug] lane and is a proposal, not a defect): \"When I'm scrolling through a timeline I want to be able to see where I am at the top of the page like it would say Ryder/Jay Balmer as I scroll down that would stick at the top of the page. Maybe even some of the menu rows could be hidden while scrolling, and as I pulled back down, those would reappear, so auto hiding some of the menu rows when I'm scrolling and keeping the location event place or whatever visible instead while scrolling.\" Sent by Jay (signed-in member) from his own timeline at /people/0394914d-6ffd-4a18-aa1f-1aafee7ce53a on iPhone Safari 26.5 at 402x526. No screenshot, none claimed. Replay S-50. NEEDS A DRAFTING PASS. What it would touch if built: two things that are separable and should probably be sequenced separately. (1) A sticky context bar naming the entity you are inside, which is a new element on the detail pages (people/[id], and by symmetry places, events, boards, brands) and is largely additive. (2) Scroll-direction hiding of the PB-011 nav chassis, which is the shared three-row src/components/ui/nav/ chassis rendered on every community surface, so a scroll-hide behaviour there is global and changes the feel of the entire site, not just the timeline. That second half is the one that needs Jay's call, and the 402px viewport is the reason it came up: three stacked nav rows eat a lot of a phone screen. Worth noting the ask is really \"the vertical budget on mobile is too small\", which could also be answered by collapsing rows on detail pages rather than by scroll behaviour."}, {"name": "A way to verify another rider's claim and clear the \"unverified\" tag", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(from the in-app feedback widget, August 25, 2026): \"How can I verify other riders claims to remove the unverified tag? Is there an option somewhere I am missing?\" Sent by R1 (signed-in member) from /snowboarding/brands/Westbeach on iPhone Safari 26.4 at 414x433; no screenshot on this one, the widget recorded none. He is not missing anything: there is no corroboration affordance anywhere in the product today, while the brand page tells him in two places that \"Claims are unverified until corroborated by multiple members\" (brands/[slug]/page.tsx:340 and :1451). The copy promises a mechanic that does not exist. What it would touch if built: a new claim-corroboration path (who may corroborate, how many, what it changes) sitting on the existing claims.confidence and community_status fields, plus the badge surfaces BUG-177 and BUG-178 are already cleaning up, plus whatever notifies the claim's owner. Direct sibling of the parked BUG-152 part (1), the community date-verification ask, and probably the same build. Worth noting the ask arrived unprompted from a member, which is the strongest signal yet on this thread. NEEDS A DRAFTING PASS"}, {"name": "Trim the duplicated calls to action on the landing page", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(from the in-app feedback widget, August 25, 2026): \"Let's trim the redundancy on the landing page. There are 2 my timeline and browse snowboarding buttons and the text above these buttons are quite similar as well and should likely be consolidated to one.\" Sent by R1 (signed-in member, hence the \"My Timeline\" variant of the CTA) from https://linestry.com/ on iPhone Safari 26.4 at 414x750. A screenshot WAS attached but never reached the Drive bridge folder (see the bridge-filter note at the top of this file), so this bullet is from the email text alone. What it would touch if built: src/app/page.tsx only, the hero CTA pair plus the snowboarding-section CTA pair that PR #199 moved above the fold, and the two blocks of intro copy above them. Small, copy and layout only. Overlaps the parked BUG-135 (landing copy too wordy, over-uses \"stories\"), and they should almost certainly be one landing-page copy pass rather than two. NEEDS A DRAFTING PASS Update, September 3, 2026: PR #213 (edae043, Sep 2) did the copy half of this without naming either id. It dropped the repeated \"scattered\", collapsed the triple \"weave / woven / bring together\" to one use, cut the repeated \"our stories\" across the blocks and replaced the long snowboarding-focus sentence, all in src/app/page.tsx (5 insertions, 6 deletions). That is BUG-135 substantially answered and the \"text above these buttons are quite similar\" half of this bullet answered too. What it did NOT do is remove a single button, so the two \"My Timeline\" and two \"Browse Snowboarding\" CTAs this bullet was actually about are still on the page. This bullet stands, narrowed to the duplicated CTA pair; BUG-135 is flagged verify-then-close in bugs/bug-triage.md."}, {"name": "Snowboard catalog page as the destination for boards and collections", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(from the in-app feedback widget, August 20, 2026; the FIRST arrival through the new [Linestry Idea] lane shipped in PR #205): \"Snowboard catalog page - make it the best place to list your boards and your collections.\" Sent by OWNER (signed-in member) from /snowboarding/boards (desktop Chrome, 857x822; replay S-47; no screenshot claimed, none in Drive). If built, this is an elevation of the /snowboarding/boards catalog index from a browse list into the community's canonical board registry: richer board cards, collection surfacing (the claims.board_relationship rode/own/both data from the June BoardShelf work already exists to power it), and probably who-rode-it / who-collects-it rollups per board. Adjacent open items: BUG-093 (board-page edit affordance) and the parked gear-noun rename. NEEDS A DRAFTING PASS."}, {"name": "Podcast pass content follow-up", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(NOT code): the full podcast workflow (Sessions A to D) shipped as PR #167/#168/#169/#170. Remaining is the content + integrated test: hand Jay's ep-21 transcript to the podcast-mentions skill for the real A1 pass, then delete and recreate the ep-21 page (/snowboarding/events/FNRad_Jay_Balmer) end to end through the workflow as the acceptance test."}, {"name": "PB-012 Groups and Meetups", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(product initiative): group page + roster + timeline, recurring meetups with RSVP + auto-roll, question of the week, community challenge. Spec at Drive Product/PB-012-Groups-and-Meetups.docx (direction capture, NOT build-ready). Erik Traulsen is the driver; December is aspirational not committed. Needs endorse + sequence, then pre-flight Phases 1-2 into a build brief."}, {"name": "BUG-025", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(feature gap): admin surface to manage unclaimed members (people view by node_status). Needs a Cowork drafting pass."}, {"name": "BUG-093", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(feature gap): editor/admin \"Edit\" affordance on a board page. Small; needs a brief."}, {"name": "BUG-133", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(feature gap): editor/admin \"Edit\" affordance on a place page + extend the admin Places edit to cover website / description / first-snowboard-year. Direct sibling of BUG-093; could ship together as one entity-page-edit session. Small; needs a brief."}, {"name": "BUG-131", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(feature): split comma-separated brand input in the signup \"What brand do you ride?\" step into one brand per name (keep the add-a-brand flow simple). Small; needs a brief."}, {"name": "BUG-075", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(product decision): broaden the event role beyond \"Competed at\". Decide the role set first."}, {"name": "BUG-057", "group": "decision", "lead": false, "brief": "", "size": "", "what": "", "note": "(parked): leaderboard / shares-distribution view."}, {"name": "PB-011 Phase 3 remaining", "group": "parked", "lead": false, "brief": "", "size": "", "what": "", "note": "(Operations/pb011-phase3-chrome-completion-brief.md): 3A shipped (PR #39); search + Cmd-K + FAB action sheet deferred."}, {"name": "Board catalog seed merge", "group": "parked", "lead": false, "brief": "", "size": "", "what": "", "note": "(Operations/board-seed-merge-brief.md): a one-off DATA op (pure DML, no PR), not a feature session."}];
  const SHIPPED = [{"name": "Funnel drop-off repairs, PR 1 (must-ship core)", "pr": "#246/#234/#233/#235/#238", "note": "The last code item in the episode-1 run and the Queue LEAD for one day. Repairs the silent drop-offs a cold visitor hits: the shared auth-message module, the four error landings that rendered as completely normal pages because nothing in..."}, {"name": "Attribution, episode-1 carve-out", "pr": "#238/#235", "note": "The measurement half of the episode-1 run and the Queue LEAD since September 6. Section 11b of features/funnel-attribution-brief.md shipped as a strict forward-compatible subset: new src/lib/attribution.ts holds the first-touch storage c..."}, {"name": "Events catalog import + list surfacing", "pr": "#239/#240/#241/#242", "note": "sql, applied to prod), #240 (9ee99be), #241 (911be17), #242 (cdb0224), all merged Sep 7. Imported the researched snowboard events catalog into prod and then made it navigable. #239: nullable provenance columns on event_series and events..."}, {"name": "FNRad Listener Landing", "pr": "#235", "note": "The last code piece before episode 1, and item 2 of the episode-1 run. A public listener hub at /fnrad that is sayable on air, a weekly guest-story challenge keyed off one config constant (FNRAD_CHALLENGE in the new src/lib/fnrad.ts), an..."}, {"name": "Signup Intent Handoff", "pr": "#234", "note": "The episode-1 critical path and the Queue LEAD since September 4. An add-story \"intent\" now rides inside returnTo through the entire signup chain, validated by safeReturnTo at every hop and replayed exactly once on arrival, so a listener..."}, {"name": "PostHog history-change pageviews + reset on sign out (Step 0 carve)", "pr": "#233", "note": "The ~10 minute Step 0 the whole episode-1 run was told to do first, carved out of features/funnel-event-completion-brief.md as task T14 and shipped alone. capture_pageview moved from true to \"history_change\" so App Router client-side nav..."}, {"name": "Duplicate-person prevention (Phases 1 to 3) + admin merge panel", "pr": "#227/#228/#229/#231", "note": "Opened as BUG-179 follow-up work and grew into the pass that closes the duplicate-ghost class of bug: Phase 1 gates the rider pickers on catalogLoaded so a picker rendered before the catalog arrives can no longer mint a duplicate person;..."}, {"name": "Feed same-day claim grouping", "pr": "#232", "note": "Closes the most-repeated item the bug queue has carried, three reports across eleven weeks, and retires the BUG-076 bullet that sat in \"Needs a Jay decision\" below. A member's run of 3+ claims added on the same day folds into one header-..."}];

  const GROUPS = [["ready","Ready to build (value-ordered)"],["decision","Needs a decision / drafting pass"],["parked","Deferred / parked"]];
  let filter = "all", query = "";

  function badge(g){ return g==="ready"?'<span class="b ready">ready</span>':g==="decision"?'<span class="b dec">decision</span>':'<span class="b park">parked</span>'; }

  function render(){
    const counts = { ready:0, decision:0, parked:0 };
    FEATURES.forEach(f => counts[f.group]++);
    document.getElementById("counts").innerHTML =
      '<span class="count"><b>'+counts.ready+'</b> ready</span>' +
      '<span class="count">decisions <b>'+counts.decision+'</b></span>' +
      '<span class="count">parked <b>'+counts.parked+'</b></span>' +
      '<span class="count">shipped (recent) <b>'+SHIPPED.length+'</b></span>';
    document.getElementById("sub").textContent = "Snapshot as of "+SNAPSHOT+". Source: features/feature-queue.md. Lead: "+LEAD+". Regenerated by the morning digest.";

    const list = document.getElementById("list");
    list.innerHTML = "";
    let shown = 0;
    GROUPS.forEach(([g,label]) => {
      if (filter !== "all" && filter !== g) return;
      const items = FEATURES.filter(f => f.group===g && match(f));
      if (!items.length) return;
      const h = document.createElement("div"); h.className="group"; h.textContent=label; list.appendChild(h);
      items.forEach(f => { list.appendChild(card(f)); shown++; });
    });
    if (!shown) list.innerHTML = '<div class="empty">No features match.</div>';

    document.getElementById("shipped").innerHTML = SHIPPED.map(s =>
      '<div class="ship"><b>'+s.name+'</b>'+(s.pr?' ('+s.pr+')':'')+' '+s.note+'</div>').join("");
    document.getElementById("foot").innerHTML =
      "This is a snapshot dashboard generated from features/feature-queue.md by the morning digest (features/render-features.py). Features have no BUG id; they reconcile off bugs/SHIP-LOG.md type:feature + git.";
  }

  function match(f){
    if (!query) return true;
    const s = (f.name+" "+f.what+" "+f.note).toLowerCase();
    return s.includes(query);
  }

  function card(f){
    const d = document.createElement("div");
    d.className = "card" + (f.lead ? " lead" : "");
    let inner = '<div class="row1"><span class="name">'+f.name+'</span>'+
      '<div class="badges">'+(f.lead?'<span class="b lead-b">lead</span>':'')+badge(f.group)+'</div></div>';
    if (f.what) inner += '<div class="what">'+f.what+'</div>';
    if (f.note) inner += '<div class="note">'+f.note+'</div>';
    if (f.size) inner += '<div class="size">'+f.size+'</div>';
    if (f.brief) inner += '<div class="brief">'+f.brief+'</div>';
    d.innerHTML = inner;
    return d;
  }

  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
    c.classList.add("active"); filter = c.dataset.f; render();
  }));
  document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

  render();
</script>
</body>
</html>
